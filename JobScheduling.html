<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Scheduling - Interactive & Customizable</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;
            box-sizing: border-box;
            overflow: auto;
        }
        
        /* Configuration Panel */
        #config-panel {
            background: #333;
            padding: 15px 30px;
            border-radius: 8px 8px 0 0;
            display: flex;
            gap: 15px;
            align-items: center;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            border-bottom: 2px solid #555;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="number"], input[type="text"] {
            background: #222;
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            font-size: 16px;
        }
        input[type="number"] { width: 60px; }
        input[type="text"] { width: 250px; }
        
        #controls {
            background: #2d2d2d;
            padding: 15px 30px;
            border-radius: 0 0 8px 8px;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 900px;
            justify-content: space-between;
            flex-wrap: wrap;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover:not(:disabled) { background: #45a049; }
        button:disabled { background: #555; cursor: not-allowed; opacity: 0.7; }
        
        #pauseBtn { background: #2196F3; }
        #pauseBtn:hover:not(:disabled) { background: #1976D2; }
        #randomBtn, #applyBtn { background: #9c27b0; padding: 8px 15px; font-size: 14px;}
        #randomBtn:hover:not(:disabled), #applyBtn:hover:not(:disabled) { background: #7b1fa2; }
        #resetBtn { background: #f44336; }
        #resetBtn:hover:not(:disabled) { background: #d32f2f; }

        #blackboard {
            flex-grow: 1;
            width: 100%;
            max-width: 900px;
            background: #223322;
            border: 5px solid #553311;
            border-radius: 10px;
            margin: 20px 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            min-height: 250px;
            box-sizing: border-box;
        }
        #variables {
            font-size: 20px;
            color: #ffd700;
            margin-bottom: 20px;
            font-family: monospace;
        }
        #teacher-text {
            font-size: 24px;
            color: #fff;
            min-height: 80px;
        }

        #bottom-section {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: auto; 
            padding-bottom: 40px;
        }

        #job-queue {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            min-height: 50px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .queue-item {
            width: 40px;
            height: 40px;
            background: #ff9800;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            font-weight: bold;
            transition: opacity 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .scene {
            perspective: 1000px;
            display: flex;
            gap: 40px;
            align-items: flex-end;
            flex-wrap: wrap; /* Allows bins to wrap to next line if too many workers */
            justify-content: center;
        }
        .worker-bin {
            width: 90px; /* Slightly narrower to fit more */
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-10deg);
            border-left: 2px solid rgba(255,255,255,0.3);
            border-right: 2px solid rgba(255,255,255,0.3);
            border-bottom: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 40px; /* Space for wrapping */
        }
        .worker-label {
            position: absolute;
            bottom: -30px;
            width: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
        .worker-total {
            position: absolute;
            top: -30px;
            width: 100%;
            text-align: center;
            color: #4CAF50;
            font-weight: bold;
        }
        .job-block {
            width: 70px; /* Matched to bin width */
            background: #007acc;
            border: 1px solid #005a99;
            margin-bottom: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Configuration Panel -->
    <div id="config-panel">
        <div class="input-group">
            <label for="workerInput">Workers:</label>
            <input type="number" id="workerInput" min="1" max="8" value="3">
        </div>
        <div class="input-group">
            <label for="jobInput">Jobs:</label>
            <input type="text" id="jobInput" value="9, 8, 7, 6, 6, 5, 5, 4">
        </div>
        <button id="applyBtn">Apply Setup</button>
        <button id="randomBtn">Randomize!</button>
    </div>

    <!-- Controls Panel -->
    <div id="controls">
        <div class="btn-group">
            <button id="startBtn">Start Learning!</button>
            <button id="pauseBtn" disabled>Pause</button>
            <button id="resetBtn" disabled>Stop & Reset</button>
        </div>
        <div>
            <label for="speed">Animation Speed:</label>
            <input type="range" id="speed" min="100" max="3000" value="800" dir="rtl">
        </div>
    </div>

    <div id="blackboard">
        <div id="variables">Waiting to start...</div>
        <div id="teacher-text">Customize your jobs above, then click "Start Learning"!</div>
    </div>

    <div id="bottom-section">
        <div style="margin-bottom: 10px; font-weight: bold; color:#aaa;">Jobs waiting to be assigned:</div>
        <div id="job-queue"></div>
        <div class="scene" id="workers-container"></div>
    </div>

    <script>
        // Global State Variables
        let NUM_WORKERS = 3; 
        let jobs = [9, 8, 7, 6, 6, 5, 5, 4];
        
        let speedMs = 800; 
        let isRunning = false;
        let isPaused = false;
        let currentRunId = 0; // Used to safely abort previous runs

        const variablesDisplay = document.getElementById('variables');
        const teacherText = document.getElementById('teacher-text');
        
        // Buttons & Inputs
        const workerInput = document.getElementById('workerInput');
        const jobInput = document.getElementById('jobInput');
        const applyBtn = document.getElementById('applyBtn');
        const randomBtn = document.getElementById('randomBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const speedSlider = document.getElementById('speed');
        
        speedSlider.addEventListener('input', (e) => speedMs = e.target.value);
        
        // Configuration Logic
        function parseAndApplyInputs() {
            let w = parseInt(workerInput.value);
            if (w < 1) w = 1; if (w > 8) w = 8; // Keep it from breaking the screen
            NUM_WORKERS = w;
            workerInput.value = w;

            let rawJobs = jobInput.value.split(',');
            let parsedJobs = [];
            for (let str of rawJobs) {
                let num = parseInt(str.trim());
                if (!isNaN(num) && num > 0) parsedJobs.push(num);
            }
            if (parsedJobs.length === 0) parsedJobs = [5]; // Fallback if empty
            
            jobs = parsedJobs;
            jobs.sort((a, b) => b - a); // Crucial sorting step
            jobInput.value = jobs.join(', ');
            
            initUI();
            resetBlackboard();
        }

        function generateRandom() {
            let randomWorkers = Math.floor(Math.random() * 3) + 2; // 2 to 4 workers
            let randomJobCount = Math.floor(Math.random() * 6) + 5; // 5 to 10 jobs
            let newJobs = [];
            for(let i=0; i<randomJobCount; i++) {
                newJobs.push(Math.floor(Math.random() * 12) + 2); // Durations 2 to 13
            }
            workerInput.value = randomWorkers;
            jobInput.value = newJobs.join(', ');
            parseAndApplyInputs();
        }

        applyBtn.addEventListener('click', parseAndApplyInputs);
        randomBtn.addEventListener('click', generateRandom);

        // UI Resetting
        function initUI() {
            const wc = document.getElementById('workers-container');
            const jq = document.getElementById('job-queue');
            wc.innerHTML = ''; jq.innerHTML = '';
            
            for(let i=0; i<NUM_WORKERS; i++) {
                wc.innerHTML += `
                    <div class="worker-bin" id="worker-${i}">
                        <div class="worker-total" id="total-${i}">0 hrs</div>
                        <div class="worker-label">Worker ${i+1}</div>
                    </div>`;
            }

            jobs.forEach((job, idx) => {
                jq.innerHTML += `<div class="queue-item" id="queue-${idx}">${job}</div>`;
            });
        }

        function resetBlackboard() {
            variablesDisplay.innerText = "Ready to analyze...";
            setTeacher("Setup applied! Click Start Learning to begin.", "#fff");
        }

        function setTeacher(text, color = "#fff") {
            teacherText.style.color = color;
            teacherText.innerText = text;
        }

        function toggleInputs(disabled) {
            workerInput.disabled = disabled;
            jobInput.disabled = disabled;
            applyBtn.disabled = disabled;
            randomBtn.disabled = disabled;
            startBtn.disabled = disabled;
            resetBtn.disabled = !disabled;
            pauseBtn.disabled = !disabled;
        }

        // Execution Control Logic
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.innerText = "Resume";
                pauseBtn.style.background = "#ff9800"; 
            } else {
                pauseBtn.innerText = "Pause";
                pauseBtn.style.background = "#2196F3"; 
            }
        });

        resetBtn.addEventListener('click', () => {
            isRunning = false; // Signals the recursive loop to die
            isPaused = false;
            pauseBtn.innerText = "Pause";
            pauseBtn.style.background = "#2196F3";
            toggleInputs(false);
            initUI();
            resetBlackboard();
        });

        const sleep = async (runId) => {
            await new Promise(r => setTimeout(r, speedMs));
            while (isPaused && currentRunId === runId && isRunning) {
                await new Promise(r => setTimeout(r, 100));
            }
        };

        // --- MAIN ALGORITHM ---
        async function runAlgorithm() {
            if(isRunning) return;
            
            // Clean slate start
            parseAndApplyInputs(); 
            isRunning = true;
            currentRunId++;
            let runId = currentRunId;
            toggleInputs(true);
            
            let totalSum = jobs.reduce((a, b) => a + b, 0);
            let maxJob = jobs[0]; // because we sorted descending
            let right = totalSum;
            let bestAnswer = right;
            
            let mathMin = Math.ceil(totalSum / NUM_WORKERS);
            let left = Math.max(maxJob, mathMin);

            setTeacher(`We have ${totalSum} total hours of work to distribute among ${NUM_WORKERS} workers.`, "#fff");
            await sleep(runId); await sleep(runId);
            if (!isRunning || currentRunId !== runId) return;

            if (mathMin > maxJob) {
                setTeacher(`MATH SHORTCUT: ${totalSum} hours divided by ${NUM_WORKERS} workers is ${mathMin}. We won't test any limit lower than ${mathMin}!`, "#00ffff");
                await sleep(runId); await sleep(runId); await sleep(runId);
            }

            while (left <= right && isRunning && currentRunId === runId) {
                let mid = Math.floor((left + right) / 2);
                variablesDisplay.innerText = `Search Range: [${left} to ${right}] | Testing Target Limit: ${mid} hours`;
                setTeacher(`Let's see if we can finish ALL jobs by giving everyone a strict limit of ${mid} hours!`, "#ffd700");
                await sleep(runId);

                let workloads = new Array(NUM_WORKERS).fill(0);
                let possible = await backtrack(0, mid, workloads, runId);

                if (!isRunning || currentRunId !== runId) return;

                if (possible) {
                    bestAnswer = mid;
                    right = mid - 1;
                    setTeacher(`Hooray! We DID IT in ${mid} hours. Can we do even better? Let's lower the target!`, "#4CAF50");
                } else {
                    left = mid + 1;
                    setTeacher(`Oh no, ${mid} hours is too tight. We couldn't fit the jobs. We must increase the target time!`, "#ff4444");
                }
                await sleep(runId); 
                
                // Visually reset the bins for the next binary search iteration
                initUI();
            }

            if (isRunning && currentRunId === runId) {
                variablesDisplay.innerText = `Finished! Optimal Time: ${bestAnswer} hours`;
                setTeacher(`All done! The absolute fastest time we can finish all jobs is ${bestAnswer} hours.`, "#4CAF50");
                isRunning = false;
                toggleInputs(false);
            }
        }

        async function backtrack(jobIdx, limit, workloads, runId) {
            if (!isRunning || currentRunId !== runId) return false;
            
            if (jobIdx === jobs.length) {
                return true; 
            }

            let job = jobs[jobIdx];
            document.getElementById(`queue-${jobIdx}`).style.opacity = '0.3'; 

            for (let w = 0; w < NUM_WORKERS; w++) {
                if (!isRunning || currentRunId !== runId) return false;

                if (workloads[w] + job <= limit) {
                    setTeacher(`Let's give the ${job}-hour job to Worker ${w+1}.`);
                    
                    workloads[w] += job;
                    const block = document.createElement('div');
                    block.className = 'job-block';
                    block.id = `block-${jobIdx}`;
                    // Scale block height visually based on job size (maxing out around bin height)
                    block.style.height = `${job * 15}px`; 
                    block.innerText = job;
                    
                    document.getElementById(`worker-${w}`).appendChild(block);
                    document.getElementById(`total-${w}`).innerText = `${workloads[w]} hrs`;
                    
                    await sleep(runId);

                    if (await backtrack(jobIdx + 1, limit, workloads, runId)) {
                        return true; 
                    }
                    if (!isRunning || currentRunId !== runId) return false;

                    setTeacher(`Ah, putting the ${job}-hour job in Worker ${w+1} caused a dead end later. Taking it out!`, "#ffaa00");
                    workloads[w] -= job;
                    let blockToRemove = document.getElementById(`block-${jobIdx}`);
                    if(blockToRemove) blockToRemove.remove();
                    document.getElementById(`total-${w}`).innerText = `${workloads[w]} hrs`;
                    await sleep(runId);

                } else {
                    setTeacher(`The ${job}-hour job won't fit in Worker ${w+1}. It would pass our ${limit} hour limit!`, "#ff4444");
                    await sleep(runId);
                }

                if (workloads[w] === 0) {
                    setTeacher(`Wait! Worker ${w+1} is totally empty but still failed. There's no reason to try other empty workers. Skipping them!`, "#ff00ff");
                    await sleep(runId);
                    break; // Pruning!
                }
            }
            
            let queueItem = document.getElementById(`queue-${jobIdx}`);
            if(queueItem) queueItem.style.opacity = '1'; 
            return false;
        }

        startBtn.addEventListener('click', runAlgorithm);
        parseAndApplyInputs(); // Initial setup on page load
    </script>
</body>
</html>
